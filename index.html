<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C4A">
<title>Ghid Brașov</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EDE8; --card:#F8FAF7; --ink:#1A1F21; --muted:#56636A; --line:#D0D8D2;
  --accent:#1F5C4A; --on-accent:#FFFFFF; --ochre:#C98F1E; --warn-bg:#F7E4DD; --warn-ink:#7A2A1C;
  --chip:#DCE5DF; --video:#161B1D;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111517; --card:#1A2023; --ink:#E9EEEB; --muted:#9AA8AD; --line:#2A3236;
    --accent:#58B091; --on-accent:#0E1A16; --ochre:#E2B04A; --warn-bg:#3A201A; --warn-ink:#F2B8A8;
    --chip:#232C30; --video:#0B0E0F;
  }
}
:root[data-theme="dark"]{
  --bg:#111517; --card:#1A2023; --ink:#E9EEEB; --muted:#9AA8AD; --line:#2A3236;
  --accent:#58B091; --on-accent:#0E1A16; --ochre:#E2B04A; --warn-bg:#3A201A; --warn-ink:#F2B8A8;
  --chip:#232C30; --video:#0B0E0F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-bottom:84px;min-height:100vh}
.pad{padding:0 18px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
#nav a .ic{font-size:21px;line-height:1}
#nav a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* top bars */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .t{font-family:var(--serif);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}

/* intro */
.intro{padding:26px 18px 8px}
.intro h1{font-size:34px;letter-spacing:-.01em}
.intro p{margin-top:8px;color:var(--muted);max-width:34ch}
.sec{padding:22px 18px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:21px}
.sec span{color:var(--muted);font-size:14px}

/* route */
.route{list-style:none;margin:8px 0 0;padding:0 18px 0 18px;position:relative}
.route::before{content:"";position:absolute;left:36px;top:18px;bottom:30px;width:3px;background:repeating-linear-gradient(to bottom,var(--ochre) 0 8px,transparent 8px 14px)}
.stop{position:relative;display:grid;grid-template-columns:38px 1fr;gap:12px;margin:0 0 14px}
.node{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;z-index:1;border:3px solid var(--bg);margin-top:10px}
.stopcard{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none}
.stopcard .thumb{min-height:104px}
.stopcard .thumb svg{display:block;width:100%;height:100%}
.stopbody{padding:10px 12px 10px 0;min-width:0}
.stopbody h3{font-size:17px}
.stopbody .s{font-size:14px;color:var(--muted);margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:12.5px}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}

/* hero */
.hero{display:block;width:100%;aspect-ratio:400/220;background:var(--video)}
.hero svg{display:block;width:100%;height:100%}
.cap{font-size:12px;color:var(--muted);padding:6px 18px 0}
.head{padding:16px 18px 4px}
.head h1{font-size:28px}
.head .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;padding:14px 18px 6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid var(--accent);cursor:pointer}
.btn.main{background:var(--accent);color:var(--on-accent);flex:1 1 140px}
.btn.alt{background:transparent;color:var(--accent);flex:1 1 140px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.banner{margin:12px 18px 0;padding:11px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:14.5px}
.blk{padding:18px 18px 0}
.blk h2{font-size:19px;margin-bottom:8px}
.blk p+p{margin-top:8px}
.kv{display:grid;gap:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kv dt{font-size:12.5px;color:var(--muted);margin:0 0 2px}
.kv dd{margin:0}
.kv a{color:var(--accent);font-weight:700}
.video{margin:0 18px;border-radius:14px;background:var(--video);color:#E9EEEB;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:14px;position:relative;overflow:hidden}
.video .play{width:58px;height:58px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;margin:0 auto 8px}
.video .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.video small{opacity:.8}
.gal{display:flex;gap:10px;overflow-x:auto;padding:0 18px 6px;scroll-snap-type:x mandatory}
.gal .tile{flex:0 0 74%;scroll-snap-align:start;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.gal .tile svg{display:block;width:100%;height:100%}
.score{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score b{font-family:var(--serif);font-size:30px}
.stars{color:var(--ochre);letter-spacing:2px}
.small{font-size:13px;color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 18px 0}
.pn a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;font-size:14px}
.pn a span{display:block;color:var(--muted);font-size:12px}
.pn a:last-child{text-align:right}

/* explore */
.search{padding:12px 18px 0}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:16px;font-family:var(--sans)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 0}
.ctile{position:relative;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;min-height:128px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,hsl(var(--h) 45% 26%),hsl(calc(var(--h) + 18) 52% 44%))}
.ctile .e{position:absolute;top:10px;right:12px;font-size:40px}
.ctile h3{font-size:18px;color:#fff}
.ctile p{font-size:12.5px;opacity:.92;margin-top:2px}
.ctile .n{font-size:12px;opacity:.85;margin-top:4px}
.grp{padding:20px 18px 8px;font-size:17px;font-family:var(--serif);font-weight:700}
.rows{display:grid;gap:8px;padding:0 18px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none}
.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,hsl(var(--h) 45% 28%),hsl(calc(var(--h) + 18) 52% 46%))}
.rowbody{min-width:0;display:grid;gap:1px}
.rowbody strong{font-size:15.5px}
.rowbody .o{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rowbody .a{font-size:12.5px;color:var(--muted)}
.rate{font-size:13px;font-weight:700;color:var(--ochre);white-space:nowrap}
.empty{padding:28px 18px;color:var(--muted)}
.foot{padding:26px 18px 10px;font-size:12.5px;color:var(--muted)}
.sos{margin:12px 18px 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.sos a{color:inherit}

/* events */
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;text-align:center;font:inherit;font-weight:700;font-size:15px;cursor:pointer;line-height:1.25}
.dchip small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dchip[aria-pressed="true"] small{color:inherit}
.cchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:5px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.cchip[aria-pressed="true"]{background:var(--chip);border-color:var(--accent);font-weight:700}
.evday{padding:20px 18px 8px;font-size:17px;font-family:var(--serif);font-weight:700}
.evrow{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none}
.dateb{border-radius:12px;background:var(--chip);text-align:center;padding:6px 0;line-height:1.1}
.dateb b{display:block;font-family:var(--serif);font-size:22px}
.dateb span{font-size:12px;color:var(--muted)}
.evrow strong{font-size:15.5px;display:block}
.evrow .v{font-size:13.5px;color:var(--muted);margin-top:2px}
.evrow .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{margin:12px 18px 0;padding:11px 14px;border-radius:12px;background:var(--chip);font-size:14px}
.tools{padding:12px 18px 0}
.tools .row2{display:flex;gap:8px;margin-top:10px}
.tools select,.tools button.loc{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;padding:0 10px}
.tools select{flex:1}
.tools button.loc{cursor:pointer;font-weight:700}
.tools button.loc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tools input[type=search]{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:16px;font-family:var(--sans)}
.dist{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rv{border-top:1px solid var(--line);padding:10px 0}
.rv:first-of-type{border-top:0}
.lock{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14.5px}
.rform label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.rform textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.rform .pick{display:flex;gap:4px}
.rform .pick button{font-size:28px;line-height:1;background:none;border:0;color:var(--ochre);cursor:pointer;padding:4px}

</style>
</head>

var DATA={"tour":[{"id":"piata-sfatului","section":"oras","name":"Piața Sfatului și Casa Sfatului","emoji":"🏛️","lat":45.6424,"lng":25.589,"address":"Piața Sfatului, Brașov","short":"Inima orașului vechi, cu turnul cu ceas al Casei Sfatului.","desc":"Piața medievală de unde începe aproape orice traseu. Clădirea din mijloc, Casa Sfatului (secolul al XV-lea), găzduiește azi Muzeul Județean de Istorie. În jur sunt terase, restaurante și case colorate, iar din piață se vede Tâmpa.","hours":"Piața: acces permanent. Muzeul din Casa Sfatului: mar–dum 10:00–18:00, închis luni.","phone":"+40 268 472 350"},{"id":"strada-republicii","section":"oras","name":"Strada Republicii","emoji":"🚶","lat":45.6431,"lng":25.5921,"address":"Strada Republicii, Brașov","short":"Promenada pietonală cu terase, magazine și muzică stradală.","desc":"Strada pietonală principală, care pornește din zona Pieței Sfatului. Aici găsești terase, magazine și mici ateliere. Seara se umple de oameni, iar uneori cântă artiști stradali.","hours":"Stradă pietonală, acces permanent. Magazinele și terasele au programul lor.","phone":null},{"id":"biserica-neagra","section":"oras","name":"Biserica Neagră","emoji":"⛪","lat":45.6411,"lng":25.5882,"address":"Curtea Johannes Honterus 2, Brașov","short":"Cea mai mare biserică gotică din sud-estul Europei.","desc":"Construită de comunitatea sașilor între 1385 și 1477, a primit numele după Marele Incendiu din 1689, care i-a înnegrit zidurile. Înăuntru sunt o orgă Buchholz din 1839, cu aproape 4.000 de tuburi, și o colecție de covoare orientale.","hours":"Lun și dum 12:00–19:00; mar–sâm 10:00–19:00. Bilet aprox. 30 lei; casa de bilete e în magazinul de suveniruri de vizavi, conform recenziilor.","phone":"+40 772 253 781"},{"id":"strada-sforii","section":"oras","name":"Strada Sforii","emoji":"↔️","lat":45.6396,"lng":25.5886,"address":"Strada Sforii, Brașov","short":"Una dintre cele mai înguste străzi din Europa.","desc":"Un pasaj îngust între case vechi, cu lățime de puțin peste un metru în punctul cel mai strâmt. A fost folosit odinioară ca trecere pentru pompieri.","hours":"Verifică accesul înainte să mergi.","status":"Închisă temporar pentru vizitatori, conform recenziilor din iunie și iulie 2026. Se poate vedea de la poartă.","phone":null},{"id":"poarta-ecaterinei","section":"oras","name":"Poarta Ecaterinei","emoji":"🏰","lat":45.6395,"lng":25.5861,"address":"Centrul Vechi, Brașov","short":"Singura poartă medievală păstrată întreagă, cu patru turnulețe.","desc":"A fost construită în 1559 de breasla croitorilor, după ce inundațiile au distrus poarta veche. Prin ea intrau în oraș românii din cartierul Șchei. Interiorul nu se vizitează, dar poarta e un bun punct de reper: de aici ajungi la Bastionul Țesătorilor sau în Șchei.","hours":"Acces liber, doar din exterior.","phone":null},{"id":"bastionul-tesatorilor","section":"oras","name":"Bastionul Țesătorilor","emoji":"🛡️","lat":45.637,"lng":25.589,"address":"Strada George Coșbuc 9, Brașov","short":"Cel mai bine păstrat bastion al fortificațiilor, cu macheta orașului vechi.","desc":"Construit în două etape, 1421–1436 și 1570–1573, de breasla țesătorilor. Galeriile de lemn înconjoară curtea interioară, iar înăuntru e o machetă a Brașovului medieval. Din turn se vede orașul.","hours":"Mar–dum 10:00–18:00, închis luni. Intrarea în curte și în turn e liberă; muzeul din interior are taxă mică.","phone":"+40 268 472 368"},{"id":"turnul-alb","section":"oras","name":"Turnul Alb","emoji":"🗼","lat":45.6429,"lng":25.5866,"address":"Calea Poienii, Brașov","short":"Punct de belvedere asupra Pieței Sfatului și a Bisericii Negre.","desc":"Turn de apărare construit pe un deal deasupra orașului vechi. Urcă pe poteca din pădure și cobori pe scări, sau invers. Priveliștea asupra pieței și a Bisericii Negre e cea mai bună la apus.","hours":"Google: mar–sâm 09:00–17:00, dar interiorul nu se vizitează în mod obișnuit. Zona din jur este liberă.","status":"Interiorul este de obicei închis; priveliștea se vede din exterior.","phone":"+40 268 472 350"},{"id":"turnul-negru","section":"oras","name":"Turnul Negru","emoji":"🏯","lat":45.6413,"lng":25.5857,"address":"Strada Gheorghe Barițiu, Brașov","short":"Turn de pe deal, cu priveliște direct spre Biserica Neagră.","desc":"La aproximativ 10 minute de mers pe jos din centru, printr-o pădurice. Intrarea în zona turnului e gratuită. Cadrul cu Biserica Neagră în față este unul dintre cele mai fotografiate din oraș.","hours":"Zona din jur: acces liber. Turnul în sine apare cu program 09:00–17:00 pe Google, dar de regulă este încuiat.","status":"Interiorul este de obicei închis.","phone":null},{"id":"tampa","section":"oras","name":"Muntele Tâmpa","emoji":"🚡","lat":45.6389,"lng":25.5932,"address":"Aleea Tiberiu Brediceanu, Brașov","short":"Panorama orașului și literele BRAȘOV, la câteva minute cu telecabina.","desc":"Telecabina urcă în 3–5 minute de lângă centrul vechi. Sus, o potecă de aproximativ 10 minute duce la literele BRAȘOV, de unde se vede tot orașul. Poți coborî și pe jos, pe cărări marcate.","hours":"Sursele diferă: mar–dum aprox. 09:30–17:00, iar altele indică program până seara. Verifică la stația de jos. Bilet aprox. 45 lei dus-întors, 30 lei un sens, conform recenziilor.","status":"Platforma de observație de sus era închisă în august 2026. Priveliștea se vede de la literele BRAȘOV.","phone":"+40 268 407 342"},{"id":"schei","section":"oras","name":"Șcheii Brașovului","emoji":"⛪","lat":45.6356,"lng":25.5813,"address":"Piața Unirii, Brașov","short":"Cartierul românesc istoric, cu Biserica Sf. Nicolae și Prima Școală Românească.","desc":"Aici au locuit secole la rând românii, care nu aveau voie să stea în cetate. Biserica Sf. Nicolae are turnuri subțiri și picturi exterioare, iar Prima Școală Românească păstrează presa cu care diaconul Coresi a tipărit primele cărți în română.","hours":"Prima Școală Românească: lun–vin 10:00–17:00, sâm 11:00–17:00, dum 12:00–14:00, bilet aprox. 20 lei. Biserica Sf. Nicolae: verifică programul.","status":"Biserica Sf. Nicolae era în renovare în vara lui 2026, conform recenziilor.","phone":"+40 740 028 678"},{"id":"cetatuia","section":"oras","name":"Cetățuia de pe Strajă","emoji":"🏰","lat":45.6493,"lng":25.5917,"address":"Strada Cetății 7, Brașov","short":"Fortificație din secolul al XVI-lea, pe un deal liniștit.","desc":"Cetate pătrată cu bastioane în colțuri, construită în afara zidurilor orașului. Se ajunge pe jos, în câteva minute, printr-o pădurice. De la bază se vede aproape tot Brașovul.","hours":"Interiorul este închis pentru vizitatori. Zona din jur are acces liber.","status":"Cetățuia este închisă pentru reconstrucție; poți urca și privi orașul din jur. Atenție la urși pe traseele din pădure.","phone":null},{"id":"bran","section":"excursii","name":"Castelul Bran","emoji":"🧛","km":30,"lat":45.5149,"lng":25.3672,"address":"Strada General Traian Moșoiu 24, Bran","short":"Cel mai cunoscut obiectiv din zonă, asociat cu legenda lui Dracula.","desc":"Castel pe o stâncă, la aproximativ 30 km de Brașov. Se vizitează liber sau cu tur ghidat; un bilet extins include camera de tortură și tunelul. Aglomerat vara, deci vino dimineața.","hours":"Lun 12:00–19:00; mar–dum 09:00–19:00. Bilet aprox. 25 € plus aprox. 6 € pentru camera de tortură, conform recenziilor.","phone":"+40 268 237 700"},{"id":"poiana-brasov","section":"excursii","name":"Poiana Brașov","emoji":"⛰️","km":12,"lat":45.5874,"lng":25.5512,"address":"Strada Poiana Soarelui 160, Poiana Brașov","short":"Stațiune montană la 12 km, cu gondolă spre Postăvarul.","desc":"Iarna e cea mai mare zonă de schi din apropiere, iar vara aici sunt trasee de drumeție, de bicicletă și plimbări călare. Gondola Postăvarul urcă pe munte, cu priveliște spre Carpații Meridionali.","hours":"Gondola Postăvarul: zilnic 09:00–16:00. Bilet aprox. 70 lei dus-întors, 40 lei un sens, conform recenziilor.","phone":"+40 268 407 342"},{"id":"rasnov","section":"excursii","name":"Cetatea Râșnov","emoji":"🏰","km":15,"lat":45.5906," function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function enc(s){return encodeURIComponent(s);}
function fmtR(r){return Number(r).toFixed(1).replace('.',',');}
function fmtN(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function stars(r){var f=Math.round(r),s='';for(var i=1;i<=5;i++)s+=i<=f?'★':'☆';return s;}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function mapsOpen(q){return 'https://www.google.com/maps/search/?api=1&query='+enc(q);}
function mapsDir(q){return 'https://www.google.com/maps/dir/?api=1&destination='+enc(q);}
function ext(href,cls,label){return '<a class="btn '+cls+'" href="'+esc(href)+'" target="_blank" rel="noopener">'+label+'</a>';}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rnd(seed){var s=(seed>>>0)||1;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}

function isBar(p){return p.cat==='noapte'||/pub|cocktail|bere/i.test(p.group||'');}
function vis(p){
  var c=CBYID[p.cat]; var t=(p.name+' '+p.offer).toLowerCase();
  for(var i=0;i<RULES.length;i++){ if(RULES[i][0].test(t)) return {e:RULES[i][1],hue:c.hue,mono:isBar(p)}; }
  return {e:c.emoji,hue:c.hue,mono:isBar(p)};
}
function initials(name){
  var w=name.replace(/\([^)]*\)/g,'').split(/[\s&\-']+/).filter(function(x){return x&&!/^(the|la|de|și|and|\d+)$/i.test(x);});
  var base=w[0]||name;
  if(w.length<2) return base.slice(0,2).toUpperCase();
  return (base.charAt(0)+w[1].charAt(0)).toUpperCase();
}
function roofs(seed){
  var r=rnd(seed), x=-10, out='';
  while(x<410){ var w=24+r()*26, h=18+r()*32, base=220;
    out+='<path d="M'+x.toFixed(0)+' '+base+'V'+(base-h).toFixed(0)+'L'+(x+w/2).toFixed(0)+' '+(base-h-12-r()*10).toFixed(0)+'L'+(x+w).toFixed(0)+' '+(base-h).toFixed(0)+'V'+base+'Z"/>';
    x+=w+2+r()*4; }
  return out;
}

/* ---------- utilitare ---------- */
function haversine(a,b){
  var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function walkMin(a,b){ return Math.max(1,Math.round(haversine(a,b)*1.3/75)); }

var MEM={};
function sget(k){try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;}}
function sset(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
function revAll(){try{return JSON.parse(sget('gb_rev')||'{}')||{};}catch(e){return {};}}
function revOf(id){return revAll()[id]||[];}
function avgOf(id){var r=revOf(id);return r.length?r.reduce(function(a,x){return a+x.s;},0)/r.length:0;}
function bought(){return sget('gb_buy')==='1';}
function reviewBlock(id,query){
  var r=revOf(id), h='<section class="blk" id="rvblk" data-id="'+esc(id)+'"><h2>Recenzii</h2>';
  if(r.length){
    var a=avgOf(id);
    h+='<p class="score"><b>'+fmtR(a)+'</b><span class="stars" aria-hidden="true">'+stars(a)+'</span><span class="small">'+r.length+(r.length===1?' recenzie':' recenzii')+' din aplicație</span></p>';
    r.slice().reverse().forEach(function(x){
      h+='<div class="rv"><span class="stars" aria-label="'+x.s+' din 5">'+stars(x.s)+'</span> <span class="small">'+esc(x.n||'Utilizator')+' · '+esc(x.d)+'</span>'+(x.t?'<p style="margin-top:4px">'+esc(x.t)+'</p>':'')+'</div>';
    });
  } else {
    h+='<p class="small">Încă nu există recenzii. Notele și recenziile vin doar de la utilizatorii aplicației.</p>';
  }
  if(bought()){
    h+='<form class="rform" id="rform" data-star="0"><label>Nota ta</label><div class="pick" role="group" aria-label="Alege nota">'
      +[1,2,3,4,5].map(function(n){return '<button type="button" data-star="'+n+'" aria-label="'+n+' stele">☆</button>';}).join('')
      +'</div><label for="rtext">Recenzia ta (opțional)</label><textarea id="rtext" maxlength="600" placeholder="Ce ți-a plăcut? Cum a fost serviciul?"></textarea>'
      +'<div style="margin-top:10px"><button type="submit" class="btn main">Trimite recenzia</button></div><p class="small" id="rerr" style="margin-top:6px"></p></form>';
  } else {
    h+='<div class="lock"><strong>Recenziile se scriu doar după achiziția aplicației.</strong><p class="small" style="margin-top:4px">Așa păstrăm notele reale, fără import din Google. În aplicația finală, achiziția se verifică prin Google Play / App Store.</p>'

document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act="buy"],.pick button'); if(!t) return;
  if(t.getAttribute('data-act')==='buy'){ sset('gb_buy','1'); route(); return; }
  var f=document.getElementById('rform'), n=+t.getAttribute('data-star'); if(!f) return;
  f.setAttribute('data-star',n);
  [].forEach.call(f.querySelectorAll('.pick button'),function(b){ b.textContent=(+b.getAttribute('data-star')<=n)?'★':'☆'; });
});
document.addEventListener('submit',function(e){
  var f=e.target; if(!f||f.id!=='rform') return; e.preventDefault();
  var n=+f.getAttribute('data-star'), blk=document.getElementById('rvblk');
  if(!n){ document.getElementById('rerr').textContent='Alege o notă de la 1 la 5 stele.'; return; }

  return '<a class="row" href="#/loc/'+p.id+'"><span class="badge" style="--h:'+v.hue+'" aria-hidden="true">'+(v.e==='needles'?'💉':v.e)+'</span>'
    +'<span class="rowbody"><strong>'+esc(p.name)+'</strong><span class="o">'+esc(p.offer)+'</span><span class="a">'+esc(p.address)+'</span></span>'
    +'<span class="rate">'+(a?'★ '+fmtR(a):'')+(d!=null?'<br><span class="dist">'+fmtDist(d)+'</span>':'')+'</span></a>';
}

var PRICE={'ieftin':1,'moderat':2,'ridicat':3,'foarte ridicat':4};
var cf={q:'',g:'Toate',sort:'rec',note:''};
function catList(c){
  var v=norm(cf.q.trim()), items=[];
  c.groups.forEach(function(g){ if(cf.g!=='Toate'&&cf.g!==g.name) return;
    g.places.forEach(function(p){ if(!v||norm(p.name+' '+p.offer+' '+p.group+' '+p.address).indexOf(v)>=0) items.push(p); }); });
  if(!items.length) return '<p class="empty">Nu am găsit nimic. Încearcă alt cuvânt sau alt filtru.</p>';
  if(cf.sort==='rec'&&cf.g==='Toate'&&!v){
    return c.groups.map(function(g){ return '<h2 class="grp">'+esc(g.name)+'</h2><div class="rows">'+g.places.map(rowHTML).join('')+'</div>'; }).join('');
  }
  var s=items.slice();
  if(cf.sort==='dist') s.sort(function(a,b){var x=distTo(a),y=distTo(b);return (x==null?1e9:x)-(y==null?1e9:y);});
  else if(cf.sort==='nota') s.sort(function(a,b){return avgOf(b.id)-avgOf(a.id);});
  else if(cf.sort==='pret') s.sort(function(a,b){return (PRICE[a.price]||9)-(PRICE[b.price]||9);});
  return '<div class="rows" style="padding-top:12px">'+s.map(rowHTML).join('')+'</div>';
}
function catChips(c){
  if(c.groups.length<2) return '';
  return ['Toate'].concat(c.groups.map(function(g){return g.name;})).map(function(n){
    return '<button class="cchip" data-g="'+esc(n)+'" aria-pressed="'+(cf.g===n)+'">'+esc(n)+'</button>';}).join('');
}
function catPage(id){
  var c=CBYID[id]; if(!c) return exploreHome();
  setNav('exp');
  cf={q:'',g:'Toate',sort:'rec',note:''};
  var hasLL=c.groups.some(function(g){return g.places.some(function(p){return p.ll;});});
  var html='<div class="bar">'+backBtn('#/explora')+'<span class="t">'+c.emoji+' '+esc(c.name)+'</span></div>';
  if(id==='sanatate') html+='<div class="sos">Pentru urgențe sună la <a href="tel:112">112</a>. Lista nu înlocuiește un sfat medical.</div>';
  html+='<div class="tools"><input id="cq" type="search" placeholder="Caută: pizza, burger, cocktail, bere…" aria-label="Caută în '+esc(c.name)+'" autocomplete="off">'
    +'<div class="row2"><select id="csort" aria-label="Sortare"><option value="rec">Sortare: recomandate</option>'+(hasLL?'<option value="dist">Distanță față de mine</option>':'')+'<option value="nota">Nota din aplicație</option>'+(c.groups.some(function(g){return g.places.some(function(p){return p.price;});})?'<option value="pret">Preț (mic → mare)</option>':'')+'</select>'
    +(hasLL?'<button class="loc" id="cloc" aria-pressed="'+(!!userLoc)+'">📍 Lângă mine</button>':'')+'</div><p class="small" id="cnote" style="margin-top:6px"></p></div>';
  if(c.groups.length>1) html+='<div class="strip" id="cchips" style="flex-wrap:wrap;overflow:visible">'+catChips(c)+'</div>';
  html+='<div id="clist">'+catList(c)+'</div>';
  html+='<p class="foot">Programul și prețurile se schimbă des.'+(hasLL?' Distanțele sunt orientative (în linie dreaptă, după zonă).':'')+'</p>';
  show(html);
  var q=document.getElementById('cq'), L=function(){document.getElementById('clist').innerHTML=catList(c);};
  q.addEventListener('input',function(){cf.q=q.value;L();});
  document.getElementById('csort').addEventListener('change',function(e){
    cf.sort=e.target.value;
    if(cf.sort==='dist'&&!userLoc){ locate(c,L); } else L();
  });
  var lb=document.getElementById('cloc');
  if(lb) lb.addEventListener('click',function(){ cf.sort='dist'; document.getElementById('csort').value='dist'; locate(c,L); });
  var ch=document.getElementById('cchips');
  if(ch) ch.addEventListener('click',function(e){
    var b=e.target.closest('[data-g]'); if(!b) return; cf.g=b.getAttribute('data-g'); ch.innerHTML=catChips(c); L();
  });
}
function locate(c,L){
  var n=document.getElementById('cnote'), lb=document.getElementById('cloc');
  if(userLoc){ L(); return; }
  if(!navigator.geolocation){ n.textContent='Telefonul nu oferă locația. Distanța nu poate fi calculată.'; L(); return; }
  n.textContent='Caut locația ta…';
  navigator.geolocation.getCurrentPosition(function(pos){
    userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude}; n.textContent='Distanțe calculate față de locația ta.'; if(lb) lb.setAttribute('aria-pressed','true'); L();
  },function(){ n.textContent='Nu am putut afla locația. Permite accesul la locație și încearcă din nou.'; L(); },{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
}

function placeDetail(id){
  var p=BYID[id]; if(!p) return exploreHome();
  setNav('exp');
  var c=CBYID[p.cat], q=p.name+', '+p.address+(/bra[sș]ov/i.test(p.address)?'':', Brașov');
  var html='<div class="bar">'+backBtn('#/cat/'+p.cat)+'<span class="t">'+esc(p.name)+'</span></div>';
  html+='<div class="hero">'+heroFor(p)+'</div><p class="cap">Ilustrație. Fotografia reală se încarcă din panoul de administrare.</p>';
  html+='<div class="head"><span class="chip">'+c.emoji+' '+esc(c.name)+' · '+esc(p.group)+'</span><h1 style="margin-top:8px">'+esc(p.name)+'</h1><p class="sub">'+esc(p.offer)+'</p><p class="small" style="margin-top:4px">'+esc(p.address)+'</p></div>';
  html+=p.url?'<div class="actions">'+ext(p.url,'main','Vezi pe Airbnb')+'</div><div class="banner" role="note">Anunțurile Airbnb se schimbă. Verifică disponibilitatea și prețul pe Airbnb.</div>':'<div class="actions">'+ext(mapsDir(q),'main','Direcții')+ext(mapsOpen(q),'alt','Deschide în Maps')+'</div>';
  html+='<section class="blk"><h2>Informații</h2><dl class="kv">'
    +'<div><dt>Program și note</dt><dd>'+esc(p.hours)+'</dd></div>'
    +(p.price?'<div><dt>Preț</dt><dd>'+esc(p.price)+'</dd></div>':'')
    +'<div><dt>Contact</dt><dd>'+(p.phone?'<a href="tel:'+esc(p.phone.replace(/\s/g,''))+'">'+esc(p.phone)+'</a>':'Telefonul nu este listat.')+'</dd></div>'
    +'</dl></section>';
  html+=reviewBlock(p.id,q);
  show(html);
}


/* ---------- evenimente ---------- */
var MONTHS=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
var MONTHL=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
var DOW=['Dum','Lun','Mar','Mie','Joi','Vin','Sâm'];
var DOWL=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
var ECAT={'Muzică':['🎵',265],'Teatru':['🎭',345],'Clasică':['🎻',20],'Festivaluri':['🎪',45],'Film':['🎬',215],'Expoziții':['🖼️',160],'Stand-up':['🎤',320],'Copii':['🧸',90],'Altele':['📌',200]};
var EBYID={}; EVENTS.forEach(function(e){EBYID[e.id]=e;});
var evState={day:'all',cat:'Toate'};
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
function endOf(e){return e.end||e.start;}
function onDay(e,day){return e.start<=day&&endOf(e)>=day;}
function shortD(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function longD(s){var d=pd(s);return DOWL[d.getDay()]+', '+d.getDate()+' '+MONTHL[d.getMonth()];}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dateLabel(e){return endOf(e)!==e.start?shortD(e.start)+' – '+shortD(endOf(e)):cap1(longD(e.start));}
function evWindow(){
  var minD=EVENTS[0].start,maxD=EVENTS[0].start;
  EVENTS.forEach(function(e){if(e.start<minD)minD=e.start;if(endOf(e)>maxD)maxD=endOf(e);});
  var today=iso(new Date()), stale=today>maxD, start=today<minD||stale?minD:today;
  var days=[],d=pd(start),end=pd(maxD);
  while(d<=end&&days.length<14){days.push(iso(d));d.setDate(d.getDate()+1);}
  return {today:today,start:start,days:days,stale:stale,max:maxD};
}
function evVis(e){var c=ECAT[e.cat]||ECAT['Altele'];return {e:c[0],hue:c[1]};}
function evSort(a,b){return (a.k<b.k?-1:a.k>b.k?1:0)||((a.e.time||'99:99')<(b.e.time||'99:99')?-1:(a.e.time||'99:99')>(b.e.time||'99:99')?1:0);}
function evRow(e){
  var v=evVis(e),d=pd(e.start);
  return '<a class="evrow" href="#/eveniment/'+e.id+'"><span class="dateb" aria-hidden="true"><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()]+'</span></span>'
   +'<span><strong>'+esc(e.title)+'</strong><span class="v">'+v.e+' '+esc(e.venue)+'</span>'
   +'<span class="m"><span class="chip">'+(e.time?esc(e.time):'ora la organizator')+'</span>'
   +(endOf(e)!==e.start?'<span class="chip">până pe '+shortD(endOf(e))+'</span>':'')
   +'<span class="chip">'+esc(e.cat)+'</span>'+(e.price?'<span class="chip">'+esc(e.price)+'</span>':'')+'</span></span></a>';
}
function evControls(W){
  var h='<div class="strip" role="group" aria-label="Alege ziua"><button type="button" class="dchip" data-day="all" aria-pressed="'+(evState.day==='all')+'">Toate<small>zilele</small></button>';
  W.days.forEach(function(s){var d=pd(s);h+='<button type="button" class="dchip" data-day="'+s+'" aria-pressed="'+(evState.day===s)+'">'+(s===W.today?'Azi':DOW[d.getDay()])+'<small>'+d.getDate()+' '+MONTHS[d.getMonth()]+'</small></button>';});
  h+='</div><div class="strip" role="group" aria-label="Alege tipul">';
  ['Toate'].concat(Object.keys(ECAT)).forEach(function(c){
    if(c!=='Toate'&&!EVENTS.some(function(e){return e.cat===c;}))return;
    h+='<button type="button" class="cchip" data-cat="'+esc(c)+'" aria-pressed="'+(evState.cat===c)+'">'+(c==='Toate'?'Toate tipurile':ECAT[c][0]+' '+esc(c))+'</button>';});
  return h+'</div>';
}
function evList(W){
  var list=EVENTS.filter(function(e){
    if(evState.cat!=='Toate'&&e.cat!==evState.cat)return false;
    return evState.day==='all'?endOf(e)>=W.start:onDay(e,evState.day);
  }).map(function(e){return {e:e,k:evState.day==='all'?(e.start<W.start?W.start:e.start):evState.day};});
  list.sort(evSort);
  if(!list.length) return '<p class="empty">Nu avem evenimente pentru această alegere. Încearcă altă zi sau alt tip.</p>';
  var h='',last='';
  list.forEach(function(x){
    if(evState.day==='all'&&x.k!==last){last=x.k;h+='<h2 class="evday">'+(x.k===W.today?'Azi, ':'')+esc(longD(x.k))+'</h2><div class="rows">';
      h=h.replace(/<\/div><h2 class="evday">/,'</div><h2 class="evday">');}
    h+=evRow(x.e).replace('<a class="evrow"','<a class="evrow" style="margin-bottom:8px"');
    if(evState.day==='all'){ /* grupul se închide la schimbarea zilei */ }
  });
  if(evState.day==='all'){
    // rânduri grupate: refacem structura corect
    var g={},order=[];
    list.forEach(function(x){if(!g[x.k]){g[x.k]=[];order.push(x.k);}g[x.k].push(x.e);});
    h='';order.forEach(function(k){h+='<h2 class="evday">'+(k===W.today?'Azi, ':'')+esc(longD(k))+'</h2><div class="rows">'+g[k].map(evRow).join('')+'</div>';});
    return h;
  }
  return '<div class="rows" style="padding-top:12px">'+list.map(function(x){return evRow(x.e);}).join('')+'</div>';
}
function eventsHome(){
  setNav('ev');
  var W=evWindow();
  if(evState.day!=='all'&&W.days.indexOf(evState.day)<0)evState.day='all';
  var html='<header class="intro"><h1>Evenimente</h1><p>Concerte, teatru, filme și festivaluri din Brașov, pe zile.</p></header>';
  html+='<div class="note">Evenimentele sunt adunate din surse publice la 13 octombrie 2026. În curând, organizatorii își vor putea adăuga singuri evenimentele.</div>';
  if(W.stale)html+='<div class="banner" role="note">Lista nu a mai fost actualizată din 13 octombrie. Verifică datele la organizatori.</div>';
  html+='<div id="evbar">'+evControls(W)+'</div><div id="evlist" aria-live="polite">'+evList(W)+'</div>';
  html+='<p class="foot">Ora, prețul și disponibilitatea biletelor se confirmă la organizator. Un preț „de la” este cel mai mic afișat de platforma de bilete.</p>';
  show(html);
  app.onclick=function(ev){
    var b=ev.target.closest&&ev.target.closest('button[data-day],button[data-cat]'); if(!b)return;
    if(b.hasAttribute('data-day'))evState.day=b.getAttribute('data-day'); else evState.cat=b.getAttribute('data-cat');
    var bar=document.getElementById('evbar'); if(!bar){app.onclick=null;return;}
    var sc=[].map.call(bar.querySelectorAll('.strip'),function(s){return s.scrollLeft;});
    bar.innerHTML=evControls(W);
    [].forEach.call(bar.querySelectorAll('.strip'),function(s,i){s.scrollLeft=sc[i]||0;});
    document.getElementById('evlist').innerHTML=evList(W);
  };
}
function eventDetail(id){
  var e=EBYID[id]; if(!e) return eventsHome();
  setNav('ev'); app.onclick=null;
  var v=evVis(e),q=e.q||(e.venue+', Brașov');
  var html='<div class="bar">'+backBtn('#/evenimente')+'<span class="t">'+esc(e.title)+'</span></div>';
  html+='<div class="hero">'+heroSVG({e:v.e,hue:v.hue,seed:e.id})+'</div><p class="cap">Ilustrație. Afișul oficial se încarcă din panoul de administrare.</p>';
  html+='<div class="head"><span class="chip">'+v.e+' '+esc(e.cat)+'</span><h1 style="margin-top:8px">'+esc(e.title)+'</h1><p class="sub">'+esc(dateLabel(e))+(e.time?', ora '+esc(e.time):'')+'</p></div>';
  html+='<div class="actions">'+ext(e.url,'main','Bilete și detalii')+ext(mapsDir(q),'alt','Direcții')+'</div>';
  html+='<div class="actions" style="padding-top:0">'+ext(mapsOpen(q),'ghost','Deschide în Maps')+'</div>';
  if(!e.time)html+='<div class="banner" role="note">Ora exactă nu a fost găsită în sursele noastre. Confirm-o la organizator sau pe pagina de bilete.</div>';
  html+='<section class="blk"><h2>Despre eveniment</h2><p>'+esc(e.desc)+'</p></section>';
  html+='<section class="blk"><h2>Informații</h2><dl class="kv">'
    +'<div><dt>Data</dt><dd>'+esc(dateLabel(e))+'</dd></div>'
    +'<div><dt>Ora</dt><dd>'+(e.time?esc(e.time):'Se confirmă la organizator')+'</dd></div>'
    +'<div><dt>Locație</dt><dd>'+esc(e.venue)+'</dd></div>'
    +(e.org?'<div><dt>Organizator</dt><dd>'+esc(e.org)+'</dd></div>':'')
    +(e.price?'<div><dt>Preț</dt><dd>'+esc(e.price)+'</dd></div>':'')
    +'<div><dt>Sursă</dt><dd>'+esc(e.src)+'</dd></div></dl></section>';
  html+=reviewBlock('ev-'+e.id,'');
  show(html);
}

function route(){
  var h=location.hash||'#/tur', m;
  if((m=h.match(/^#\/tur\/(.+)$/))) return stopDetail(decodeURIComponent(m[1]));
  if((m=h.match(/^#\/cat\/(.+)$/))) return catPage(decodeURIComponent(m[1]));
  if((m=h.match(/^#\/loc\/(.+)$/))) return placeDetail(decodeURIComponent(m[1]));
  if((m=h.match(/^#\/eveniment\/(.+)$/))) return eventDetail(decodeURIComponent(m[1]));
  if(h==='#/evenimente') return eventsHome();
  if(h==='#/explora') return exploreHome();
  return tourHome();
}
var navCount=0;
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-back]');
  if(b){ e.preventDefault(); var fb=b.getAttribute('data-back'); if(navCount>0){ navCount-=2; window.history.back(); } else { location.hash=fb; } }
});
window.addEventListener('hashchange',function(){ navCount++; route(); });
route();
})();
</script>
